<!doctype html>
<html lang="en" class="dark"> <!-- force dark mode -->
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>{% block title %}Book Friend{% endblock %}</title>

    <!-- Tailwind config BEFORE CDN to enable class-based dark mode -->
    <script>
        window.tailwind = window.tailwind || {};
        tailwind.config = {darkMode: 'class'};
    </script>
    <!-- Tailwind CDN (3.4.17) -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
<nav class="bg-slate-900 text-slate-100 border-b border-slate-800">
    <div class="mx-auto max-w-6xl px-4 py-3 flex items-center justify-between">
        <a href="{{ url_for('home') }}" class="text-3xl font-bold tracking-wide">Book Friend</a>
        <div class="space-x-4">
            <a href="{{ url_for('home') }}" class="hover:text-white/90">Home</a>
            <a href="{{ url_for('books') }}" class="hover:text-white/90">Books</a>
        </div>
    </div>
</nav>

<main class="mx-auto max-w-6xl px-4 py-6">
    {% block content %}{% endblock %}
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
